[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smartbuilding"
version = "0.1.1"
description = "Smart Building Layout and Emergency Exit Planner (AI course project)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.11,<3",
    "PyYAML>=6",
    "numpy>=2",
    "plotly>=5.18",
    "pandas>=2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "hypothesis>=6",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML",
]

[project.scripts]
smartbuilding = "smartbuilding.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
smartbuilding = ["py.typed", "ui/web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# E501: ruff format wraps code; long docstrings and comments are tolerated.
ignore = ["B008", "E501"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
files = ["src"]
